# AgentGuard
#   docker compose up                    gateway + mock MCP servers + dashboard, built-in mock LLM: ready in minutes,
#                                        every guardrail, the ML classifier and the Attack Lab work
#   docker compose --profile llm up      ...plus Ollama in Docker (pulls a ~7 GB image + ~4.6 GB of models, CPU only on
#                                        a Mac: needs ~8 GB of Docker memory to be usable). AGENT_MODEL / JUDGE_MODEL pick models
#   OLLAMA_URL=http://host.docker.internal:11434 docker compose up
#                                        use the Ollama app on this machine instead (on a Mac: Apple GPU, much faster)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile llm up   NVIDIA GPU for Ollama (Linux / WSL2)
# Dashboard http://localhost:5173 · Gateway http://localhost:8000 · Ollama :11434 · Mock MCP servers :9001-9003

x-backend-image: &backend-image
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: agentguard-backend

services:
  gateway:
    <<: *backend-image
    ports: ["8000:8000"]
    environment:
      POLICY_PATH: /workspace/policy.yaml   # the live repo file: edit it on the host, it hot-reloads
      DATA_DIR: /srv/agentguard/backend/data
      LLM_PROVIDER: auto                    # Ollama when it is running and can answer, the built-in mock LLM otherwise
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      DEMO_MODEL: ${AGENT_MODEL:-qwen2.5:3b}            # model the Attack Lab's agent asks for
      JUDGE_MODEL: ${JUDGE_MODEL:-granite3-guardian:2b} # read by policy.yaml (controls.llm_judge.model)
      MCP_HOST: mcp                         # used by policy.yaml: http://${MCP_HOST:-localhost}:9001/mcp
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
      WATCHFILES_FORCE_POLLING: "true"      # file events are unreliable across bind mounts
    volumes:
      - .:/workspace                        # a directory mount, so editor "atomic saves" are seen too
      - agentguard-data:/srv/agentguard/backend/data
    depends_on: [mcp]

  mcp:
    <<: *backend-image
    command: ["python", "-m", "demo.mcp_servers", "--host", "0.0.0.0"]
    ports: ["9001:9001", "9002:9002", "9003:9003"]
    environment:
      MCP_ALLOWED_HOSTS: mcp:9001,mcp:9002,mcp:9003
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9001), 2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  dashboard:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["${DASHBOARD_PORT:-5173}:80"]
    depends_on: [gateway]

  ollama:
    profiles: [llm]
    image: &ollama-image ollama/ollama:0.35.1
    ports: ["11434:11434"]
    environment:
      OLLAMA_KEEP_ALIVE: 10m          # keep a model loaded between demo steps, free the memory when idle
      OLLAMA_MAX_LOADED_MODELS: "1"   # small machines: agent model and judge take turns instead of sharing RAM
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:                        # one-shot: download the models (cached in the ollama-models volume)
    profiles: [llm]
    image: *ollama-image
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
      AGENT_MODEL: ${AGENT_MODEL:-qwen2.5:3b}
      JUDGE_MODEL: ${JUDGE_MODEL:-granite3-guardian:2b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ollama pull "$$AGENT_MODEL"
        ollama pull "$$JUDGE_MODEL"
        echo "models ready: $$AGENT_MODEL, $$JUDGE_MODEL (loaded into memory on first use)"
    restart: "no"

volumes:
  agentguard-data:
  ollama-models:
