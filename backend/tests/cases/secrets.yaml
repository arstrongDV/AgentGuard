# Secrets: blocked when an agent sends them, redacted when they come back.

- id: secret-aws-key-inbound-blocked
  channel: llm_in
  input: "Use AKIAIOSFODNN7EXAMPLE to upload the report"
  expect: { decision: block, rules: [SECRET-AWS-KEY] }

- id: secret-aws-key-outbound-redacted
  channel: llm_out
  input: "The deployment key is AKIAIOSFODNN7EXAMPLE, keep it safe."
  expect: { decision: redact, rules: [SECRET-AWS-KEY], contains: "[SECRET_1]", not_contains: "AKIA" }

- id: secret-github-token
  channel: llm_in
  input: "token ghp_1234567890abcdefghijklmnopqrstuvwxyz for CI"
  expect: { decision: block, rules: [SECRET-GITHUB-TOKEN] }

- id: secret-private-key
  channel: llm_in
  input: "-----BEGIN RSA PRIVATE KEY----- MIIEow..."
  expect: { decision: block, rules: [SECRET-PRIVATE-KEY] }

- id: secret-jwt-in-tool-result
  channel: mcp_result
  input: "session=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U"
  expect: { decision: redact, rules: [SECRET-JWT], contains: "[SECRET_1]" }

- id: secret-api-key
  channel: llm_in
  input: "my key is sk-proj-abcdefghijklmnopqrstuvwx1234"
  expect: { decision: block, rules: [SECRET-API-KEY] }

- id: secret-generic-high-entropy
  channel: llm_in
  input: "db password: Xk9#mQ2!pL7zR4"
  expect: { decision: block, rules: [SECRET-GENERIC] }

- id: secret-generic-low-entropy-ignored
  channel: llm_in
  input: "the default password = changeme for the demo box"
  expect: { decision: allow, not_rules: [SECRET-GENERIC] }
